components:
  schemas:
    AccessRequirement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/AccessRequirementTypeEnum'
        telegram_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        username:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 255
        active:
          type: boolean
        weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - label
      - type
    AccessRequirementTypeEnum:
      enum:
      - channel
      - backup_bot
      type: string
      description: |-
        * `channel` - Required channel
        * `backup_bot` - Backup bot
    ActionEnum:
      enum:
      - delete
      - kick
      - mute
      - reply
      type: string
      description: |-
        * `delete` - Delete
        * `kick` - Kick
        * `mute` - Mute
        * `reply` - Reply
    ArchiveRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        source_chat:
          type: integer
        source_topic:
          type: integer
          nullable: true
        destination_chat:
          type: integer
        destination_topic:
          type: integer
          nullable: true
        enabled:
          type: boolean
        live:
          type: boolean
        content_types: {}
        first_message_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        last_message_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        first_message_link:
          type: string
          writeOnly: true
        last_message_link:
          type: string
          writeOnly: true
        delay_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - destination_chat
      - id
      - name
      - source_chat
      - updated_at
    ArchivedMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        chat:
          type: integer
        chat_title:
          type: string
          readOnly: true
        topic:
          type: integer
          nullable: true
        topic_name:
          type: string
          readOnly: true
        telegram_message_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        sender_telegram_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        text:
          type: string
        content_type:
          type: string
          maxLength: 32
        file_name:
          type: string
          maxLength: 255
        file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        message_date:
          type: string
          format: date-time
          nullable: true
        message_link:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - chat
      - chat_title
      - content_type
      - id
      - telegram_message_id
      - topic_name
    AutomationRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        match_type:
          $ref: '#/components/schemas/MatchTypeEnum'
        pattern:
          type: string
          maxLength: 500
        action:
          $ref: '#/components/schemas/ActionEnum'
        response:
          type: string
        duration_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        enabled:
          type: boolean
      required:
      - action
      - group
      - id
      - pattern
    BanListEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        telegram_user_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        reason:
          type: string
          maxLength: 500
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - group
      - id
      - telegram_user_id
    Chat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        telegram_id:
